<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yarnwork — a little maze of string</title>
<style>
  :root{
    --paper:#e8f2fd;
    --sky:#cfe6ff;
    --ink:#42406e;
    --ink-soft:#7e88b0;
    --blue:#7fb6f0;
    --blue-deep:#4a7fd0;
    --pink:#f4a9c8;
    --pink-deep:#e87fae;
    --purple:#b98cf0;
    --purple-deep:#8b4fd6;
    --gold:#f0c04a;
    --gold-soft:#f6d089;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 12% -10%, #dcecff 0%, rgba(220,236,255,0) 62%),
      radial-gradient(1000px 800px at 100% 110%, #e2e2ff 0%, rgba(226,226,255,0) 60%),
      radial-gradient(700px 500px at 85% 0%, #f2e8ff 0%, rgba(242,232,255,0) 60%),
      var(--paper);
    display:flex; flex-direction:column;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    padding:14px 18px 10px;
    display:flex; align-items:center; gap:16px; row-gap:9px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
  .brand h1{
    margin:0; font-size:20px; letter-spacing:.16em; text-transform:uppercase;
    font-weight:600; color:var(--purple-deep);
  }
  .brand .sub{font-size:12px; color:var(--ink-soft); letter-spacing:.08em}

  .gauge{display:flex; align-items:center; gap:9px}
  .gauge .label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}

  .lives{display:flex; gap:6px}
  .ball{
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff 0 12%, var(--pink) 30%, var(--pink-deep) 100%);
    box-shadow:0 1px 4px rgba(232,127,174,.45), inset -1px -2px 3px rgba(160,60,110,.25);
    transition:all .35s ease;
  }
  .ball.spent{
    background:radial-gradient(circle at 34% 30%, #fff 0 12%, #f2e6ee 40%, #e6d6e2 100%);
    box-shadow:none; opacity:.5; transform:scale(.78);
  }

  .stillbar{
    width:150px; height:9px; border-radius:99px; overflow:hidden;
    background:rgba(255,255,255,.72); box-shadow:inset 0 1px 2px rgba(90,110,160,.18);
  }
  .stillbar i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius:99px; transition:background .3s ease;
  }
  .stillbar.warn i{background:linear-gradient(90deg, var(--pink), var(--pink-deep))}

  .pctbar{
    width:110px; height:9px; border-radius:99px; overflow:hidden;
    background:rgba(255,255,255,.72); box-shadow:inset 0 1px 2px rgba(90,110,160,.18);
  }
  .pctbar i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--purple), var(--purple-deep));
    border-radius:99px; transition:width .28s cubic-bezier(.3,1.2,.5,1);
  }
  .pcttext{
    font-size:12px; font-weight:600; color:var(--purple-deep);
    min-width:38px; text-align:right; font-variant-numeric:tabular-nums;
  }

  .timechip{
    font-size:13px; font-weight:600; color:var(--blue-deep);
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
    background:rgba(255,255,255,.8); border:1px solid #d8e5f8;
    border-radius:99px; padding:5px 13px;
  }

  .fxrow{display:flex; gap:7px}
  .fxchip{
    display:flex; align-items:center; gap:5px;
    font-size:12px; font-weight:600; font-variant-numeric:tabular-nums;
    background:#fff; border:1px solid #d9f0ec; color:#0f8f80;
    border-radius:99px; padding:4px 11px;
    box-shadow:0 3px 10px rgba(20,184,166,.18);
    animation:fxin .3s cubic-bezier(.2,1.5,.5,1);
  }
  .fxchip b{font-size:13px; font-weight:400}
  .fxchip.danger{
    border-color:#f8ccd4; color:#d02a45;
    box-shadow:0 3px 12px rgba(224,69,95,.28);
    animation:fxin .3s cubic-bezier(.2,1.5,.5,1), gnaw 1s ease-in-out infinite;
  }
  @keyframes gnaw{50%{transform:scale(1.07)}}
  @keyframes fxin{from{transform:scale(.6); opacity:0}}

  .levelchip{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--purple-deep); background:rgba(255,255,255,.8);
    border:1px solid #d8e5f8; border-radius:99px; padding:5px 13px;
  }

  /* ---------- stage ---------- */
  #stage{flex:1 1 auto; position:relative; min-height:0}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}

  footer{
    flex:0 0 auto; padding:8px 18px 14px;
    font-size:12px; color:var(--ink-soft); letter-spacing:.06em; text-align:center;
  }
  kbd{
    font:inherit; font-size:11px; background:#fff; border:1px solid #dbe6f7;
    border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--ink);
  }

  /* ---------- overlay ---------- */
  #overlay{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(232,242,253,.84); backdrop-filter:blur(7px);
    z-index:5;
  }
  #overlay.on{display:flex; animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{
    background:#fff; border-radius:26px; padding:38px 44px;
    box-shadow:0 22px 60px rgba(70,100,170,.22), 0 2px 0 #eaf1fb;
    text-align:center; max-width:440px; animation:pop .4s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes pop{from{transform:scale(.9) translateY(10px); opacity:0}}
  .card .emoji{font-size:40px; line-height:1; margin-bottom:12px}
  .card h2{margin:0 0 10px; font-size:26px; color:var(--purple-deep); font-weight:600}
  .card p{margin:0 0 6px; font-size:14px; line-height:1.6; color:var(--ink-soft)}
  .card p.note{font-size:12.5px; margin-top:14px}
  .rules{
    text-align:left; display:inline-block; margin:16px 0 4px;
    font-size:13px; line-height:1.9; color:var(--ink);
  }
  .rules span{color:var(--pink-deep)}
  button{
    margin-top:22px; font:inherit; font-size:14px; letter-spacing:.1em;
    text-transform:uppercase; font-weight:600;
    color:#fff; background:linear-gradient(135deg, var(--purple), var(--purple-deep));
    border:none; border-radius:99px; padding:13px 34px; cursor:pointer;
    box-shadow:0 8px 20px rgba(139,79,214,.32);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(139,79,214,.38)}
  button:active{transform:translateY(0)}
  button.ghost{
    background:none; color:var(--ink-soft); box-shadow:none;
    padding:10px 18px; margin-left:6px; font-size:12px;
  }
  button.ghost:hover{color:var(--purple-deep); transform:none; box-shadow:none}

  @media (max-width:560px){
    .brand .sub{display:none}
    .stillbar{width:70px}
    .pctbar{width:58px}
    .gauge .label{display:none}
    .card{padding:30px 26px; margin:16px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Yarnwork</h1>
    <span class="sub">a little maze of string</span>
  </div>

  <div class="gauge">
    <span class="label">Stillness</span>
    <div class="stillbar" id="stillbar"><i id="stillfill"></i></div>
  </div>

  <div class="gauge">
    <span class="label">Progress</span>
    <div class="pctbar"><i id="pctfill"></i></div>
    <span class="pcttext" id="pcttext">0%</span>
  </div>

  <div class="gauge">
    <span class="label">Threads</span>
    <div class="lives" id="lives"></div>
  </div>

  <div class="fxrow" id="fxrow"></div>

  <div class="timechip" id="timechip">0:00.0</div>

  <div class="levelchip" id="levelchip">Level 1 / 11</div>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<footer>
  <kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;·&nbsp; swipe on touch &nbsp;·&nbsp; keep moving, keep away from dead ends
</footer>

<script>
(function(){
"use strict";

/* ============================================================
   Palette
   ============================================================ */
const YARN = ["#f4a9c8", "#c9a0f0", "#f6d089", "#eab6e6", "#b98cf0"];
const YARN_THEME = {pal: YARN, shadow: "rgba(170,120,190,0.13)", hair: "rgba(190,140,205,0.30)"};
const ROT_THEME  = {
  pal: ["#e0455f", "#ff6b7f", "#c02a45", "#f2748a", "#ff8fa0"],
  shadow: "rgba(150,20,45,0.20)", hair: "rgba(205,45,75,0.45)"
};
const PAPER = "#fffafc";

/* ============================================================
   Seeded RNG (so a level's yarn looks the same every frame)
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   Level shapes — nine of them, growing gently
   ============================================================ */
// still  = seconds you may stand still
// beast  = seconds before the thread beast wakes
// bspd   = beast speed in cells per second (you move 8)
const LEVELS = [
  {c: 7,  r: 6,  still: 7.0, beast: 13, bspd: 1.2},
  {c: 9,  r: 7,  still: 6.6, beast: 12, bspd: 1.3},
  {c: 11, r: 8,  still: 6.2, beast: 11, bspd: 1.4},
  {c: 13, r: 9,  still: 5.8, beast: 10, bspd: 1.5},
  {c: 15, r: 10, still: 5.4, beast:  9, bspd: 1.6},
  {c: 17, r: 11, still: 5.0, beast:  8, bspd: 1.7},
  {c: 19, r: 12, still: 4.7, beast:  8, bspd: 1.8},
  {c: 21, r: 13, still: 4.4, beast:  7, bspd: 1.9},
  {c: 23, r: 14, still: 4.1, beast:  6, bspd: 2.0},
  {c: 25, r: 15, still: 3.8, beast:  5, bspd: 2.1},
  {c: 27, r: 16, still: 3.5, beast:  4, bspd: 2.2}
];

/* ============================================================
   Maze generation — recursive backtracker
   walls: [N, E, S, W]
   ============================================================ */
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

function genMaze(cols, rows, rnd){
  const cells = new Array(cols * rows);
  for (let i = 0; i < cells.length; i++){
    cells[i] = {w: [true, true, true, true], seen: false};
  }
  const at = (c, r) => cells[r * cols + c];

  const stack = [{c: 0, r: 0}];
  at(0, 0).seen = true;
  let visited = 1;

  while (visited < cols * rows){
    const cur = stack[stack.length - 1];
    const open = [];
    for (let d = 0; d < 4; d++){
      const nc = cur.c + DX[d], nr = cur.r + DY[d];
      if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
      if (at(nc, nr).seen) continue;
      open.push(d);
    }
    if (open.length === 0){ stack.pop(); continue; }
    const d = open[Math.floor(rnd() * open.length)];
    const nc = cur.c + DX[d], nr = cur.r + DY[d];
    at(cur.c, cur.r).w[d] = false;
    at(nc, nr).w[(d + 2) % 4] = false;
    at(nc, nr).seen = true;
    visited++;
    stack.push({c: nc, r: nr});
  }
  return {cols, rows, cells, at};
}

function wallCount(maze, c, r){
  const w = maze.at(c, r).w;
  return (w[0]?1:0) + (w[1]?1:0) + (w[2]?1:0) + (w[3]?1:0);
}

/* ============================================================
   Yarn drawing
   ============================================================ */
function yarnPath(g, x0, y0, x1, y1, amp, freq, phase, ox, oy){
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const nx = -uy, ny = ux;
  const steps = Math.max(10, Math.round(len / 4));
  g.beginPath();
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const off = Math.sin(t * freq + phase) * amp * Math.sin(Math.PI * t);
    const px = x0 + ux * len * t + nx * off + ox;
    const py = y0 + uy * len * t + ny * off + oy;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
}

function drawYarnSegment(g, x0, y0, x1, y1, cs, rnd, theme){
  const TH = theme || YARN_THEME;
  const len = Math.hypot(x1 - x0, y1 - y0) || 1;
  const amp  = cs * 0.045;
  const freq = Math.PI * 2 * (1.4 + rnd() * 0.7);
  const phase = rnd() * Math.PI * 2;
  const color = TH.pal[Math.floor(rnd() * TH.pal.length)];
  const W = cs * 0.17;

  g.lineCap = "round";
  g.lineJoin = "round";

  // soft shadow under the thread
  g.strokeStyle = TH.shadow;
  g.lineWidth = W * 1.15;
  yarnPath(g, x0, y0, x1, y1, amp, freq, phase, 0, cs * 0.045);
  g.stroke();

  // the body of the thread
  g.strokeStyle = color;
  g.lineWidth = W;
  yarnPath(g, x0, y0, x1, y1, amp, freq, phase, 0, 0);
  g.stroke();

  // twist — little diagonal ticks that read as spun fibre
  const dx = (x1 - x0) / len, dy = (y1 - y0) / len;
  const nx = -dy, ny = dx;
  const step = cs * 0.155;
  g.strokeStyle = "rgba(255,255,255,0.62)";
  g.lineWidth = W * 0.26;
  for (let s = step * 0.5; s < len; s += step){
    const t = s / len;
    const off = Math.sin(t * freq + phase) * amp;
    const cx = x0 + dx * s + nx * off;
    const cy = y0 + dy * s + ny * off;
    const a = 0.62;                        // lean of the twist
    const tx = dx * Math.cos(a) + nx * Math.sin(a);
    const ty = dy * Math.cos(a) + ny * Math.sin(a);
    g.beginPath();
    g.moveTo(cx - tx * W * 0.42, cy - ty * W * 0.42);
    g.lineTo(cx + tx * W * 0.42, cy + ty * W * 0.42);
    g.stroke();
  }

  // stray fibres
  g.strokeStyle = TH.hair;
  g.lineWidth = Math.max(0.6, W * 0.09);
  const hairs = 1 + Math.floor(rnd() * 2);
  for (let h = 0; h < hairs; h++){
    const t = 0.15 + rnd() * 0.7;
    const off = Math.sin(t * freq + phase) * amp;
    const cx = x0 + dx * len * t + nx * off;
    const cy = y0 + dy * len * t + ny * off;
    const side = rnd() < 0.5 ? 1 : -1;
    const l = cs * (0.10 + rnd() * 0.13);
    const wob = (rnd() - 0.5) * 0.9;
    g.beginPath();
    g.moveTo(cx, cy);
    g.quadraticCurveTo(
      cx + (nx * side + dx * wob) * l * 0.6,
      cy + (ny * side + dy * wob) * l * 0.6,
      cx + (nx * side * 0.7 + dx * wob) * l,
      cy + (ny * side * 0.7 + dy * wob) * l
    );
    g.stroke();
  }
}

function drawKnot(g, x, y, cs, rnd){
  const r = cs * 0.105;
  const color = YARN[Math.floor(rnd() * YARN.length)];
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,0.55)";
  g.lineWidth = Math.max(0.8, r * 0.28);
  g.beginPath(); g.arc(x - r * 0.25, y - r * 0.25, r * 0.55, 0.6, 3.4); g.stroke();
}

/* ============================================================
   Game state
   ============================================================ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const livesEl = document.getElementById("lives");
const stillbar = document.getElementById("stillbar");
const stillfill = document.getElementById("stillfill");
const levelchip = document.getElementById("levelchip");
const pctfill = document.getElementById("pctfill");
const pcttext = document.getElementById("pcttext");
const timechip = document.getElementById("timechip");
const fxrow = document.getElementById("fxrow");

const MOVE_TIME = 0.125;   // seconds per cell
const moveTime = () => MOVE_TIME * (S.fx.haste > 0 ? 0.58 : 1);
const MAX_THREADS = 3;
const BEAST_LAG = 4;       // it hunts the yarn you walked, this many cells back
const BEAST_WANDER = 0.45; // ...but this often it just blunders off somewhere
const ANGRY_DUR = 1.6;     // how long the dot stays cross about a dead end
const CHEER_DUR = 1.7;     // confetti time before the level card appears

// what the little treasures in the maze do
const CHARMS = {
  scissors: {icon: "\u2702\uFE0F", name: "Scissors",     note: "Stillness eased, a little",                   dur: 7},
  spool:    {icon: "\uD83E\uDDF5", name: "Spool",        note: "A thread mended",                            dur: 3.5},
  beacon:   {icon: "\u2728",        name: "Glimmer",      note: "The way ahead lights up",                    dur: 6},
  shuttle:  {icon: "\u26A1",        name: "Shuttle",      note: "Quick feet",                                 dur: 9}
};

let S = {
  mode: "title",       // title | play | clear | over | win
  level: 0,
  maze: null,
  cs: 40, ox: 0, oy: 0,
  fabric: null,        // pre-rendered maze layer
  px: 0, py: 0,        // pixel position of the dot
  cc: 0, cr: 0,        // current cell
  tc: 0, tr: 0,        // target cell
  moving: false, mt: 0,
  still: 0, stillMax: 8,
  threads: MAX_THREADS,
  deadSeen: new Set(),  // dead ends already charged
  visited: new Set(),   // every cell stepped on
  path: [],             // the one true route, start -> goal
  pathIdx: null,        // "c,r" -> position along that route
  onPath: new Set(),    // route cells actually walked, for the progress %
  charms: null,         // "c,r" -> charm type
  eaten: new Set(),     // cells the beast has chewed red — deadly to touch
  rot: null, rotCtx: null,
  beast: null,          // the thread beast, once it wakes
  beastT: 99,           // seconds until it does
  beastWarned: false,
  fx: {slow: 0, freeze: 0, haste: 0, beacon: 0},
  toasts: [],
  confetti: [],
  joy: 0,               // 0 purple, 1 delighted green
  cheerT: 0,
  levelT: 0, totalT: 0, lastLevelT: 0,
  angryT: 0,            // countdown on the arms-crossed sulk
  trail: [],
  trailCells: ["0,0"],  // the cells you walked, in order — the beast's scent
  flash: 0, flashColor: "#e87fae",
  t: 0, shake: 0,
  goalPulse: 0
};

const held = {};       // held direction keys

/* ---------- layout ---------- */
function layout(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = stage.clientWidth, h = stage.clientHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!S.maze) return;
  const pad = 26;
  const cs = Math.floor(Math.min(
    (w - pad * 2) / S.maze.cols,
    (h - pad * 2) / S.maze.rows
  ));
  S.cs = Math.max(14, cs);
  S.ox = Math.round((w - S.cs * S.maze.cols) / 2);
  S.oy = Math.round((h - S.cs * S.maze.rows) / 2);
  weaveFabric();
  if (!S.moving){ S.px = cellX(S.cc); S.py = cellY(S.cr); }
}

const cellX = c => S.ox + (c + 0.5) * S.cs;
const cellY = r => S.oy + (r + 0.5) * S.cs;

/* ---------- pre-render the maze ---------- */
function weaveFabric(){
  const m = S.maze, cs = S.cs;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = m.cols * cs + cs, h = m.rows * cs + cs;

  const f = document.createElement("canvas");
  f.width = Math.round(w * dpr);
  f.height = Math.round(h * dpr);
  const g = f.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const rnd = mulberry32(1337 + S.level * 7919);
  const B = cs * 0.5;                    // bleed so round caps aren't clipped

  const seg = (c, r, d) => {
    const x = B + c * cs, y = B + r * cs;
    if (d === 0) drawYarnSegment(g, x, y, x + cs, y, cs, rnd);
    if (d === 3) drawYarnSegment(g, x, y, x, y + cs, cs, rnd);
    if (d === 1) drawYarnSegment(g, x + cs, y, x + cs, y + cs, cs, rnd);
    if (d === 2) drawYarnSegment(g, x, y + cs, x + cs, y + cs, cs, rnd);
  };

  for (let r = 0; r < m.rows; r++){
    for (let c = 0; c < m.cols; c++){
      const wl = m.at(c, r).w;
      if (wl[0]) seg(c, r, 0);
      if (wl[3]) seg(c, r, 3);
      if (c === m.cols - 1 && wl[1]) seg(c, r, 1);
      if (r === m.rows - 1 && wl[2]) seg(c, r, 2);
    }
  }

  // knots where threads meet
  const knotRnd = mulberry32(97 + S.level * 131);
  for (let r = 0; r <= m.rows; r++){
    for (let c = 0; c <= m.cols; c++){
      let touching = 0;
      if (c < m.cols && r < m.rows){ const w = m.at(c, r).w; if (w[0]) touching++; if (w[3]) touching++; }
      if (c > 0 && r < m.rows){ const w = m.at(c - 1, r).w; if (w[0]) touching++; if (w[1]) touching++; }
      if (c < m.cols && r > 0){ const w = m.at(c, r - 1).w; if (w[2]) touching++; if (w[3]) touching++; }
      if (c > 0 && r > 0){ const w = m.at(c - 1, r - 1).w; if (w[1]) touching++; if (w[2]) touching++; }
      if (touching >= 2) drawKnot(g, B + c * cs, B + r * cs, cs, knotRnd);
    }
  }

  S.fabric = f;
  S.fabricW = w;
  S.fabricH = h;
  S.fabricB = B;

  // a second, initially clean layer holding everything the beast has eaten
  const rot = document.createElement("canvas");
  rot.width = f.width; rot.height = f.height;
  S.rot = rot;
  S.rotCtx = rot.getContext("2d");
  S.rotCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S.eaten.forEach(k => { const [c, r] = k.split(",").map(Number); paintRot(c, r); });
}

/* ---------- one cell, chewed ---------- */
function paintRot(c, r){
  const g = S.rotCtx, cs = S.cs, B = S.fabricB;
  if (!g) return;
  const x = B + c * cs, y = B + r * cs;

  const stain = g.createRadialGradient(x + cs / 2, y + cs / 2, cs * 0.05,
                                       x + cs / 2, y + cs / 2, cs * 0.62);
  stain.addColorStop(0, "rgba(224,69,95,0.44)");
  stain.addColorStop(1, "rgba(224,69,95,0.20)");
  g.fillStyle = stain;
  roundRect(g, x + cs * 0.08, y + cs * 0.08, cs * 0.84, cs * 0.84, cs * 0.24);
  g.fill();

  const rnd = mulberry32(9001 + c * 7919 + r * 104729);
  const w = S.maze.at(c, r).w;
  if (w[0]) drawYarnSegment(g, x, y, x + cs, y, cs, rnd, ROT_THEME);
  if (w[3]) drawYarnSegment(g, x, y, x, y + cs, cs, rnd, ROT_THEME);
  if (w[1]) drawYarnSegment(g, x + cs, y, x + cs, y + cs, cs, rnd, ROT_THEME);
  if (w[2]) drawYarnSegment(g, x, y + cs, x + cs, y + cs, cs, rnd, ROT_THEME);
}

/* ---------- the one true route, by breadth-first search ---------- */
function solve(m){
  const key = (c, r) => c + "," + r;
  const prev = new Map([[key(0, 0), null]]);
  const q = [[0, 0]];
  const goal = key(m.cols - 1, m.rows - 1);
  while (q.length){
    const [c, r] = q.shift();
    if (key(c, r) === goal) break;
    for (let d = 0; d < 4; d++){
      if (m.at(c, r).w[d]) continue;
      const nc = c + DX[d], nr = r + DY[d];
      if (nc < 0 || nr < 0 || nc >= m.cols || nr >= m.rows) continue;
      const k = key(nc, nr);
      if (prev.has(k)) continue;
      prev.set(k, key(c, r));
      q.push([nc, nr]);
    }
  }
  const path = [];
  for (let k = goal; k != null; k = prev.get(k)) path.push(k);
  path.reverse();
  const idx = new Map();
  path.forEach((k, i) => idx.set(k, i));
  return {path, idx};
}

/* ---------- scatter the charms ---------- */
function scatterCharms(m, path, rnd, level){
  const onPath = new Set(path);
  const goal = (m.cols - 1) + "," + (m.rows - 1);
  const near = [], far = [];
  for (let r = 0; r < m.rows; r++){
    for (let c = 0; c < m.cols; c++){
      const k = c + "," + r;
      if (k === "0,0" || k === goal) continue;
      (onPath.has(k) ? near : far).push(k);
    }
  }
  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  shuffle(near); shuffle(far);

  const total = 2 + Math.floor(level * 0.45);        // 2 on level 1, 6 on level 11
  const onRoute = Math.max(1, Math.round(total * 0.55));
  const picks = near.slice(0, onRoute).concat(far.slice(0, total - onRoute));

  // scissors are the staple; the rest are the surprises
  const bag = ["scissors", "scissors", "shuttle", "beacon", "spool"];
  const charms = new Map();
  picks.forEach((k, i) => {
    charms.set(k, i === 0 ? "scissors" : bag[Math.floor(rnd() * bag.length)]);
  });
  return charms;
}

/* ---------- the thread beast ---------- */
function bfs(m, sc, sr){
  const prev = new Map([[sc + "," + sr, null]]);
  const order = [[sc, sr]];
  for (let i = 0; i < order.length; i++){
    const c = order[i][0], r = order[i][1];
    for (let d = 0; d < 4; d++){
      if (m.at(c, r).w[d]) continue;
      const nc = c + DX[d], nr = r + DY[d];
      if (nc < 0 || nr < 0 || nc >= m.cols || nr >= m.rows) continue;
      const k = nc + "," + nr;
      if (prev.has(k)) continue;
      prev.set(k, c + "," + r);
      order.push([nc, nr]);
    }
  }
  return {prev: prev, order: order};
}

function eat(c, r){
  const k = c + "," + r;
  if (S.eaten.has(k)) return;
  S.eaten.add(k);
  paintRot(c, r);
}

// it is two cells wide, so it takes two cells square out of the maze
function bite(c, r){
  const ac = Math.max(0, Math.min(c, S.maze.cols - 2));
  const ar = Math.max(0, Math.min(r, S.maze.rows - 2));
  eat(ac, ar); eat(ac + 1, ar); eat(ac, ar + 1); eat(ac + 1, ar + 1);
}

// The maze is a tree, so if the beast ever gets in front of you there is no way
// round it. So it may only be born in the region you can reach WITHOUT crossing
// the road ahead — cut those cells out, flood from your feet, take the farthest
// thing left. Every route from there back to you then stays behind you.
function beastSpawnCell(){
  const m = S.maze;
  const idx = S.pathIdx.get(S.cc + "," + S.cr);
  const blocked = new Set();
  if (idx == null) S.path.forEach(k => blocked.add(k));
  else for (let i = idx + 1; i < S.path.length; i++) blocked.add(S.path[i]);

  const seen = new Set([S.cc + "," + S.cr]);
  const order = [[S.cc, S.cr]];
  for (let i = 0; i < order.length; i++){
    const c = order[i][0], r = order[i][1];
    for (let d = 0; d < 4; d++){
      if (m.at(c, r).w[d]) continue;
      const nc = c + DX[d], nr = r + DY[d];
      if (nc < 0 || nr < 0 || nc >= m.cols || nr >= m.rows) continue;
      const k = nc + "," + nr;
      if (seen.has(k) || blocked.has(k)) continue;
      seen.add(k);
      order.push([nc, nr]);
    }
  }
  return order.length >= 4 ? order[order.length - 1] : null;
}

function wakeBeast(){
  const far = beastSpawnCell();
  if (!far){ S.beastT = 1.2; return; }     // nowhere fair to put it yet — wait
  S.beast = {
    c: far[0], r: far[1], tc: far[0], tr: far[1],
    px: cellX(far[0]), py: cellY(far[1]),
    mt: 0, moving: false, ang: 0,
    speed: LEVELS[S.level].bspd,
    lastDir: 0
  };
  bite(far[0], far[1]);
  S.toasts.push({
    x: S.px, y: S.py,
    text: "\uD83E\uDDB7  Something hungry woke up",
    color: "#e0607f", t: 0
  });
  S.flash = 1; S.flashColor = "#e0455f"; S.shake = 1;
  paintFx();
}

// It tracks the yarn you have already walked, a few cells back, so it always
// comes up the route behind you instead of appearing head-on in a corridor you
// have no way out of. Stand still and the lag closes to nothing.
function beastTarget(){
  const lag = Math.max(0, BEAST_LAG - Math.floor(S.still * 3));
  const i = Math.max(0, S.trailCells.length - 1 - lag);
  return S.trailCells[i];
}

// the first cell along the beast's route to that scent
function beastNext(){
  const b = S.beast;
  const home = b.c + "," + b.r;
  const prev = bfs(S.maze, b.c, b.r).prev;
  const target = beastTarget();
  if (!prev.has(target) || prev.get(target) === null) return null;
  let k = target;
  while (prev.get(k) !== home) k = prev.get(k);
  return k.split(",").map(Number);
}

// Mostly it follows your scent; often enough it simply blunders off down
// whatever corridor takes its fancy, which is worse, because you cannot predict it.
function beastChoice(){
  const b = S.beast, m = S.maze;
  const opts = [];
  for (let d = 0; d < 4; d++){
    if (m.at(b.c, b.r).w[d]) continue;
    const nc = b.c + DX[d], nr = b.r + DY[d];
    if (nc < 0 || nr < 0 || nc >= m.cols || nr >= m.rows) continue;
    opts.push([nc, nr, d]);
  }
  if (!opts.length) return null;

  const scent = beastNext();
  if (scent && Math.random() > BEAST_WANDER) return scent;

  const back = (b.lastDir + 2) % 4;
  const ahead = opts.filter(o => o[2] !== back);
  const pool = ahead.length ? ahead : opts;
  return pool[Math.floor(Math.random() * pool.length)];
}

function stepBeast(dt){
  const b = S.beast;
  b.speed += dt * 0.03;                     // it gets hungrier as it goes

  if (!b.moving){
    const nx = beastChoice();
    if (nx){
      if (nx[2] != null) b.lastDir = nx[2];
      b.tc = nx[0]; b.tr = nx[1];
      b.moving = true; b.mt = 0;
      b.ang = Math.atan2(cellY(b.tr) - cellY(b.r), cellX(b.tc) - cellX(b.c));
    }
  }
  if (b.moving){
    b.mt += dt * b.speed;
    if (b.mt >= 1){
      b.c = b.tc; b.r = b.tr;
      b.moving = false; b.mt = 0;
      bite(b.c, b.r);
    }
  }
  const f = Math.min(1, b.mt);
  b.px = cellX(b.c) + (cellX(b.tc) - cellX(b.c)) * f;
  b.py = cellY(b.r) + (cellY(b.tr) - cellY(b.r)) * f;

  if (Math.hypot(b.px - S.px, b.py - S.py) < S.cs * 0.62){
    gameOver("Eaten.",
      "The thread beast caught up and chewed you into its knot. It was always going to be faster than standing still.");
  }
}

// a soft, round, thoroughly annoyed red thing
const BEAST_C = {
  lit:  [255, 233, 237],
  mid:  [255, 146, 161],
  deep: [226,  76,  99],
  edge: [196,  46,  72],
  face: [ 92,  22,  44]
};

function drawBeast(g, cs, t){
  const bs = S.beast;
  const chomp = 0.5 + 0.5 * Math.sin(t * 6);
  const open = 0.13 + chomp * 0.46;
  const R = cs * 0.72 * (1 + Math.sin(t * 6) * 0.03);
  const C = BEAST_C;

  g.save();
  g.translate(bs.px + Math.sin(t * 20) * cs * 0.012,
              bs.py - Math.abs(Math.sin(t * 6)) * cs * 0.045);   // a little bounce

  const halo = g.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 1.7);
  halo.addColorStop(0, rgba(C.deep, 0.30));
  halo.addColorStop(1, rgba(C.deep, 0));
  g.fillStyle = halo;
  g.beginPath(); g.arc(0, 0, R * 1.7, 0, Math.PI * 2); g.fill();

  // ---- the wedge, chomping the way it is headed ----
  g.save();
  g.rotate(bs.ang);
  g.scale(1 - chomp * 0.04, 1 + chomp * 0.04);      // squashes as it bites

  g.save();
  g.shadowColor = rgba(C.deep, 0.42);
  g.shadowBlur = cs * 0.5;
  const grad = g.createRadialGradient(-R * 0.3, -R * 0.36, R * 0.08, 0, 0, R);
  grad.addColorStop(0, rgb(C.lit));
  grad.addColorStop(0.45, rgb(C.mid));
  grad.addColorStop(1, rgb(C.deep));
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, 0);
  g.arc(0, 0, R, open, Math.PI * 2 - open);
  g.closePath();
  g.fill();
  g.restore();

  // a soft outline, like a sticker
  g.strokeStyle = rgba(C.edge, 0.5);
  g.lineWidth = R * 0.05;
  g.lineJoin = "round";
  g.beginPath();
  g.moveTo(0, 0);
  g.arc(0, 0, R * 0.985, open, Math.PI * 2 - open);
  g.closePath();
  g.stroke();

  // a little tongue at the back of the bite
  g.fillStyle = "#ff9fb2";
  g.beginPath();
  g.moveTo(0, 0);
  g.arc(0, 0, R * 0.30 * (0.4 + chomp * 0.6), -open * 0.6, open * 0.6);
  g.closePath();
  g.fill();

  // two fat rounded teeth per jaw
  for (const sgn of [1, -1]){
    const ja = sgn * open;
    for (let i = 0; i < 2; i++){
      const rr = R * (0.48 + i * 0.28);
      const tx = Math.cos(ja) * rr, ty = Math.sin(ja) * rr;
      g.fillStyle = "rgba(190,70,95,0.35)";
      g.beginPath(); g.arc(tx, ty + R * 0.012, R * 0.105, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fffafb";
      g.beginPath(); g.arc(tx, ty, R * 0.10, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();

  // shine
  g.fillStyle = "rgba(255,255,255,0.42)";
  g.beginPath(); g.ellipse(-R * 0.32, -R * 0.36, R * 0.22, R * 0.14, -0.6, 0, Math.PI * 2); g.fill();

  // ---- big cross eyes, always the right way up ----
  let ea = bs.ang - Math.PI / 2;
  if (Math.sin(ea) > 0.001) ea = bs.ang + Math.PI / 2;

  const dx = S.px - bs.px, dy = S.py - bs.py;
  const dl = Math.hypot(dx, dy) || 1;

  for (const sgn of [1, -1]){
    const a = ea + sgn * 0.42;
    const ex = Math.cos(a) * R * 0.44, ey = Math.sin(a) * R * 0.44;
    const tx = Math.cos(ea) * R * 0.44 - ex, ty = Math.sin(ea) * R * 0.44 - ey;
    const tl = Math.hypot(tx, ty) || 1;
    const ix = tx / tl, iy = ty / tl;

    g.fillStyle = "#fff";
    g.beginPath(); g.ellipse(ex, ey, R * 0.165, R * 0.185, 0, 0, Math.PI * 2); g.fill();

    const look = R * 0.055;
    const pxp = ex + dx / dl * look, pyp = ey + dy / dl * look;
    g.fillStyle = rgb(C.face);
    g.beginPath(); g.arc(pxp, pyp, R * 0.093, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.95)";
    g.beginPath(); g.arc(pxp - R * 0.038, pyp - R * 0.042, R * 0.036, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(pxp + R * 0.034, pyp + R * 0.03, R * 0.019, 0, Math.PI * 2); g.fill();

    // brow, dragged crossly down toward the middle
    g.strokeStyle = rgb(C.face);
    g.lineWidth = R * 0.072;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(ex - ix * R * 0.21, ey - iy * R * 0.21 - R * 0.27);
    g.lineTo(ex + ix * R * 0.15, ey + iy * R * 0.15 - R * 0.13);
    g.stroke();

    // blush
    g.fillStyle = "rgba(255,120,150,0.42)";
    g.beginPath(); g.ellipse(ex, ey + R * 0.25, R * 0.115, R * 0.07, 0, 0, Math.PI * 2); g.fill();
  }

  // a small anger puff, round the back out of the way
  const ma = bs.ang + Math.PI;
  const mx = Math.cos(ma) * R * 0.60, my = Math.sin(ma) * R * 0.60;
  const sp = R * 0.16 * (0.75 + Math.sin(t * 12) * 0.12);
  g.strokeStyle = "rgba(255,140,165,0.9)";
  g.lineWidth = R * 0.05;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(mx - sp * 0.55, my - sp * 0.10); g.lineTo(mx - sp * 0.05, my - sp * 0.60);
  g.lineTo(mx - sp * 0.05, my - sp * 0.05);
  g.moveTo(mx + sp * 0.05, my + sp * 0.05); g.lineTo(mx + sp * 0.05, my + sp * 0.60);
  g.lineTo(mx + sp * 0.55, my + sp * 0.10);
  g.stroke();

  g.restore();
}

/* ---------- level setup ---------- */
function startLevel(n){
  S.level = n;
  const L = LEVELS[n];
  const rnd = mulberry32(20260901 + n * 4241);
  S.maze = genMaze(L.c, L.r, rnd);
  S.stillMax = L.still;
  S.still = 0;
  S.cc = 0; S.cr = 0; S.tc = 0; S.tr = 0;
  S.moving = false; S.mt = 0;
  S.deadSeen = new Set();
  S.visited = new Set(["0,0"]);
  const sol = solve(S.maze);
  S.path = sol.path;
  S.pathIdx = sol.idx;
  S.onPath = new Set(["0,0"]);
  S.charms = scatterCharms(S.maze, sol.path, mulberry32(555 + n * 8887), n);
  S.fx = {slow: 0, freeze: 0, haste: 0, beacon: 0};
  S.eaten = new Set();
  S.beast = null;
  S.beastT = L.beast;
  S.beastWarned = false;
  S.toasts = [];
  S.confetti = [];
  S.joy = 0; S.cheerT = 0;
  S.levelT = 0;
  S.angryT = 0;
  S.trail = [];
  S.trailCells = ["0,0"];
  S.flash = 0;
  S.goalPulse = 0;
  S.mode = "play";
  layout();
  S.px = cellX(0); S.py = cellY(0);
  S.trail.push({x: S.px, y: S.py});
  paintHud();
  paintPct();
  paintFx();
}

function paintPct(){
  // only the true route counts — wandering off it earns nothing
  const pct = S.onPath.size / S.path.length * 100;
  pctfill.style.width = pct.toFixed(2) + "%";
  pcttext.textContent = Math.round(pct) + "%";
}

function fmtTime(sec){
  const m = Math.floor(sec / 60);
  const r = sec - m * 60;
  return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
}

function paintFx(){
  const parts = [];
  if (S.fx.slow > 0)   parts.push(["\u2702\uFE0F", S.fx.slow]);
  if (S.fx.freeze > 0) parts.push(["\uD83E\uDDF5", S.fx.freeze]);
  if (S.fx.haste > 0)  parts.push(["\u26A1", S.fx.haste]);
  if (S.fx.beacon > 0) parts.push(["\u2728", S.fx.beacon]);
  let danger = null;
  if (S.mode === "play"){
    if (S.beast) danger = "loose";
    else if (S.beastT <= 9) danger = Math.max(0, Math.ceil(S.beastT)) + "s";
  }
  const sig = danger + "|" + parts.map(p => p[0] + Math.ceil(p[1])).join("|");
  if (sig === S.fxSig) return;
  S.fxSig = sig;
  fxrow.innerHTML = "";
  if (danger){
    const el = document.createElement("div");
    el.className = "fxchip danger";
    el.innerHTML = "<b></b><span></span>";
    el.firstChild.textContent = "\uD83E\uDDB7";
    el.lastChild.textContent = danger;
    fxrow.appendChild(el);
  }
  parts.forEach(([icon, left]) => {
    const el = document.createElement("div");
    el.className = "fxchip";
    el.innerHTML = "<b></b><span></span>";
    el.firstChild.textContent = icon;
    el.lastChild.textContent = Math.ceil(left) + "s";
    fxrow.appendChild(el);
  });
}

function paintHud(){
  levelchip.textContent = "Level " + (S.level + 1) + " / " + LEVELS.length;
  livesEl.innerHTML = "";
  for (let i = 0; i < MAX_THREADS; i++){
    const b = document.createElement("div");
    b.className = "ball" + (i < MAX_THREADS - S.threads ? " spent" : "");
    livesEl.appendChild(b);
  }
}

/* ---------- movement ---------- */
function tryMove(d){
  if (S.mode !== "play" || S.moving) return;
  const m = S.maze;
  if (m.at(S.cc, S.cr).w[d]) return;          // a thread is in the way
  const nc = S.cc + DX[d], nr = S.cr + DY[d];
  if (nc < 0 || nr < 0 || nc >= m.cols || nr >= m.rows) return;
  S.tc = nc; S.tr = nr;
  S.moving = true; S.mt = 0;
  S.still = 0;
}

function arrive(){
  S.cc = S.tc; S.cr = S.tr;
  S.moving = false;
  S.px = cellX(S.cc); S.py = cellY(S.cr);
  S.trail.push({x: S.px, y: S.py});
  if (S.trail.length > 340) S.trail.shift();
  S.trailCells.push(S.cc + "," + S.cr);
  S.still = 0;
  const here = S.cc + "," + S.cr;
  if (S.eaten.has(here)){
    gameOver("You touched the rot.",
      "That stretch of yarn had already been chewed through. Red thread doesn't hold anyone.");
    return;
  }
  S.visited.add(here);
  if (S.pathIdx.has(here)) S.onPath.add(here);
  paintPct();

  if (S.charms.has(here)) takeCharm(here);

  const m = S.maze;
  const isGoal = (S.cc === m.cols - 1 && S.cr === m.rows - 1);
  const isStart = (S.cc === 0 && S.cr === 0);

  if (isGoal){ levelClear(); return; }

  if (!isStart && wallCount(m, S.cc, S.cr) === 3){
    const key = S.cc + "," + S.cr;
    if (!S.deadSeen.has(key)){
      S.deadSeen.add(key);
      S.threads--;
      S.flash = 1; S.flashColor = "#e8506e";
      S.shake = 1;
      S.angryT = ANGRY_DUR;
      paintHud();
      if (S.threads <= 0) gameOver("The thread ran out.",
        "Three dead ends unravelled the last of it. Nothing lost but a little string.");
    }
  }
}

/* ---------- charms ---------- */
function takeCharm(key){
  const type = S.charms.get(key);
  S.charms.delete(key);
  const C = CHARMS[type];
  let note = C.note;

  if (type === "scissors")     S.fx.slow += C.dur;
  else if (type === "shuttle") S.fx.haste += C.dur;
  else if (type === "beacon")  S.fx.beacon += C.dur;
  else if (type === "spool"){
    if (S.threads < MAX_THREADS){ S.threads++; paintHud(); }
    else { S.fx.freeze += C.dur; note = "Stillness held at bay"; }
  }
  S.toasts.push({x: S.px, y: S.py, text: C.icon + "  " + note, t: 0});
  paintFx();
}

/* ---------- outcomes ---------- */
const TEALS = ["#14b8a6", "#2dd4bf", "#5eead4", "#99f6e4", "#0d9488", "#6ee7d7", "#0f766e"];

function mkConfetti(x, y, vx, vy, delay){
  return {
    x: x, y: y, vx: vx, vy: vy, delay: delay,
    rot: Math.random() * 6.283, vrot: (Math.random() - 0.5) * 9,
    w: 5 + Math.random() * 8, h: 8 + Math.random() * 13,
    color: TEALS[Math.floor(Math.random() * TEALS.length)],
    ribbon: Math.random() < 0.35,
    life: 3.6 + Math.random() * 2.6, age: 0
  };
}

function burstConfetti(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const gx = cellX(S.maze.cols - 1), gy = cellY(S.maze.rows - 1);
  // a pop out of the golden ball...
  for (let i = 0; i < 80; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 130 + Math.random() * 430;
    S.confetti.push(mkConfetti(gx, gy, Math.cos(a) * sp, Math.sin(a) * sp - 200, 0));
  }
  // ...then the whole screen comes down in teal
  for (let i = 0; i < 170; i++){
    S.confetti.push(mkConfetti(
      Math.random() * w, -30 - Math.random() * h * 1.1,
      (Math.random() - 0.5) * 100, 60 + Math.random() * 150,
      Math.random() * 0.55));
  }
}

function stepConfetti(dt){
  const h = stage.clientHeight;
  for (let i = S.confetti.length - 1; i >= 0; i--){
    const p = S.confetti[i];
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.age += dt;
    p.vy += 540 * dt;
    p.vy *= 1 - 1.15 * dt;
    p.vx *= 1 - 1.35 * dt;
    p.x += (p.vx + Math.sin(p.age * 5 + p.rot) * 38) * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    if (p.y > h + 50 || p.age > p.life) S.confetti.splice(i, 1);
  }
}

function drawConfetti(g){
  for (const p of S.confetti){
    if (p.delay > 0) continue;
    const fade = Math.min(1, (p.life - p.age) / 0.9);
    if (fade <= 0) continue;
    g.save();
    g.globalAlpha = fade;
    g.translate(p.x, p.y);
    g.rotate(p.rot);
    g.fillStyle = p.color;
    if (p.ribbon){
      g.beginPath();
      g.moveTo(-p.w * 0.5, -p.h * 0.5);
      g.quadraticCurveTo(p.w * 0.7, 0, -p.w * 0.5, p.h * 0.5);
      g.quadraticCurveTo(p.w * 0.05, 0, -p.w * 0.5, -p.h * 0.5);
      g.fill();
    } else {
      g.scale(1, Math.max(0.22, Math.abs(Math.cos(p.age * 7))));
      g.fillRect(-p.w * 0.5, -p.h * 0.5, p.w, p.h);
    }
    g.restore();
  }
}

function levelClear(){
  S.mode = "cheer";
  S.cheerT = 0;
  S.lastLevelT = S.levelT;
  S.totalT += S.levelT;
  S.onPath = new Set(S.path);     // you're through: the route is complete
  paintPct();
  burstConfetti();
}

function showClearCard(){
  if (S.level >= LEVELS.length - 1){
    S.mode = "win";
    show({
      emoji: "\uD83E\uDDF6\u2728",
      title: "All eleven, unwound.",
      body: "You threaded every maze without sitting still and without running out of string. The yarn basket is empty and the little dot is free.",
      html: '<div class="rules">Last level <span>' + fmtTime(S.lastLevelT) +
            '</span><br>All eleven <span>' + fmtTime(S.totalT) + '</span></div>',
      btn: "Wind it up again",
      action: () => { S.threads = MAX_THREADS; S.totalT = 0; paintHud(); hide(); startLevel(0); }
    });
    return;
  }
  S.mode = "clear";
  show({
    emoji: "\uD83C\uDF38",
    title: "Level " + (S.level + 1) + " unravelled",
    body: "Neatly done. The next tangle is a little wider \u2014 and a little less patient with stillness.",
    html: '<div class="rules">This level <span>' + fmtTime(S.lastLevelT) +
          '</span><br>Running total <span>' + fmtTime(S.totalT) + '</span></div>',
    btn: "Next level",
    action: () => { hide(); startLevel(S.level + 1); }
  });
}

function gameOver(title, body){
  if (S.mode !== "play") return;          // only die once
  S.mode = "over";
  show({
    emoji: "🪡",
    title: title,
    body: body,
    btn: "Try this level again",
    ghost: "Start from level 1",
    action: () => { S.threads = MAX_THREADS; paintHud(); hide(); startLevel(S.level); },
    ghostAction: () => { S.threads = MAX_THREADS; S.totalT = 0; paintHud(); hide(); startLevel(0); }
  });
}

/* ---------- overlay plumbing ---------- */
function show(o){
  card.innerHTML = "";
  const e = document.createElement("div"); e.className = "emoji"; e.textContent = o.emoji; card.appendChild(e);
  const h = document.createElement("h2"); h.textContent = o.title; card.appendChild(h);
  const p = document.createElement("p"); p.textContent = o.body; card.appendChild(p);
  if (o.html) card.insertAdjacentHTML("beforeend", o.html);
  const b = document.createElement("button"); b.textContent = o.btn;
  b.onclick = o.action; card.appendChild(b);
  if (o.ghost){
    const g = document.createElement("button");
    g.className = "ghost"; g.textContent = o.ghost; g.onclick = o.ghostAction;
    card.appendChild(g);
  }
  overlay.classList.add("on");
  S.primary = o.action;
  setTimeout(() => b.focus(), 30);
}
function hide(){ overlay.classList.remove("on"); S.primary = null; }

function title(){
  S.mode = "title";
  show({

          '<span>·</span> Dawdle and the thread beast wakes. Never touch red.' +

/* ============================================================
   Drawing
   ============================================================ */
function drawGoal(g, x, y, cs, t){
  const pulse = 1 + Math.sin(t * 2.4) * 0.045;
  const r = cs * 0.30 * pulse;

  g.save();
  g.shadowColor = "rgba(240,192,74,0.55)";
  g.shadowBlur = cs * 0.55;
  const grad = g.createRadialGradient(x - r * 0.32, y - r * 0.36, r * 0.1, x, y, r);
  grad.addColorStop(0, "#fff4d6");
  grad.addColorStop(0.45, "#f6d089");
  grad.addColorStop(1, "#e0a92f");
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.restore();

  // wound strands
  g.save();
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip();
  g.strokeStyle = "rgba(190,140,30,0.35)";
  g.lineWidth = Math.max(1, r * 0.11);
  for (let i = 0; i < 5; i++){
    const a = t * 0.25 + i * 0.72;
    g.beginPath();
    g.ellipse(x, y, r * (0.95 - i * 0.05), r * (0.34 + i * 0.07), a, 0, Math.PI * 2);
    g.stroke();
  }
  g.restore();

  // loose end
  g.strokeStyle = "#e0a92f";
  g.lineWidth = Math.max(1, r * 0.13);
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(x + r * 0.8, y + r * 0.3);
  g.quadraticCurveTo(x + r * 1.6, y + r * 0.9, x + r * 1.15, y + r * 1.5);
  g.stroke();

  // sparkles
  for (let i = 0; i < 3; i++){
    const a = t * 0.9 + i * 2.1;
    const rr = r * (1.55 + Math.sin(t * 1.7 + i) * 0.22);
    const sx = x + Math.cos(a) * rr, sy = y + Math.sin(a) * rr;
    const s = cs * 0.055 * (0.7 + Math.sin(t * 3 + i * 2) * 0.3);
    g.fillStyle = "rgba(255,232,160,0.9)";
    g.beginPath();
    g.moveTo(sx, sy - s); g.lineTo(sx + s * 0.35, sy); g.lineTo(sx, sy + s); g.lineTo(sx - s * 0.35, sy);
    g.closePath(); g.fill();
  }
}

function mix(a, b, t){
  return [
    Math.round(a[0] + (b[0] - a[0]) * t),
    Math.round(a[1] + (b[1] - a[1]) * t),
    Math.round(a[2] + (b[2] - a[2]) * t)
  ];
}
const rgb  = c => "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";

// happy purple -> cross red
const C_LIT   = [[230,210,255], [255,224,226]];
const C_MID   = [[185,140,240], [255,138,155]];
const C_DEEP  = [[122, 63,201], [214, 44, 76]];
const C_FACE  = [[ 74, 31,122], [126, 16, 42]];
// ...and the green it turns when it finds the gold
const C_JOY   = [[222,255,232], [ 96,222,150], [ 20,142, 92], [ 12, 82, 54]];

function drawCharm(g, x, y, cs, type, t){
  const U = cs * 0.40;
  const bob = Math.sin(t * 2.6 + x * 0.03) * cs * 0.045;
  g.save();
  g.translate(x, y + bob);

  const tint = type === "scissors" ? "180,190,210"
             : type === "spool"    ? "244,169,200"
             : type === "beacon"   ? "240,192,74"
             :                       "125,227,211";
  const halo = g.createRadialGradient(0, 0, U * 0.2, 0, 0, U * 1.5);
  halo.addColorStop(0, "rgba(" + tint + ",0.42)");
  halo.addColorStop(1, "rgba(" + tint + ",0)");
  g.fillStyle = halo;
  g.beginPath(); g.arc(0, 0, U * 1.5, 0, Math.PI * 2); g.fill();

  g.lineCap = "round";
  g.lineJoin = "round";

  if (type === "scissors"){
    g.strokeStyle = "#8f9bb3";
    g.lineWidth = U * 0.15;
    g.beginPath();
    g.moveTo(-U * 0.46, U * 0.34); g.lineTo(U * 0.42, -U * 0.62);
    g.moveTo(U * 0.46, U * 0.34);  g.lineTo(-U * 0.42, -U * 0.62);
    g.stroke();
    g.strokeStyle = "#e87fae";
    g.lineWidth = U * 0.13;
    g.beginPath(); g.arc(-U * 0.54, U * 0.58, U * 0.24, 0, Math.PI * 2);
    g.arc(U * 0.54, U * 0.58, U * 0.24, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = "#6f7c95";
    g.beginPath(); g.arc(0, U * 0.05, U * 0.11, 0, Math.PI * 2); g.fill();

  } else if (type === "spool"){
    g.fillStyle = "#f6d089";
    roundRect(g, -U * 0.52, -U * 0.66, U * 1.04, U * 0.20, U * 0.08); g.fill();
    roundRect(g, -U * 0.52, U * 0.46, U * 1.04, U * 0.20, U * 0.08); g.fill();
    g.fillStyle = "#f4a9c8";
    g.fillRect(-U * 0.34, -U * 0.5, U * 0.68, U * 1.0);
    g.strokeStyle = "rgba(255,255,255,0.65)";
    g.lineWidth = U * 0.07;
    for (let i = -2; i <= 2; i++){
      g.beginPath();
      g.moveTo(-U * 0.34, U * i * 0.19);
      g.lineTo(U * 0.34, U * i * 0.19 + U * 0.1);
      g.stroke();
    }

  } else if (type === "beacon"){
    const pl = 1 + Math.sin(t * 5) * 0.1;
    g.fillStyle = "#f6d089";
    g.beginPath();
    for (let i = 0; i < 4; i++){
      const a = i * Math.PI / 2;
      const bx = Math.cos(a), by = Math.sin(a);
      const nx = -by, ny = bx;
      g.lineTo(bx * U * 0.9 * pl, by * U * 0.9 * pl);
      g.quadraticCurveTo(0, 0, nx * -U * 0.9 * pl, ny * -U * 0.9 * pl);
    }
    g.closePath(); g.fill();
    g.fillStyle = "#fff6dd";
    g.beginPath(); g.arc(0, 0, U * 0.2, 0, Math.PI * 2); g.fill();

  } else { // shuttle — a pointed weaving shuttle with thread wound round it
    g.fillStyle = "#7de3d3";
    g.beginPath();
    g.moveTo(-U * 0.85, 0);
    g.quadraticCurveTo(0, -U * 0.52, U * 0.85, 0);
    g.quadraticCurveTo(0, U * 0.52, -U * 0.85, 0);
    g.fill();
    g.strokeStyle = "#0f8f80";
    g.lineWidth = U * 0.11;
    g.beginPath();
    g.moveTo(-U * 0.22, -U * 0.27); g.lineTo(-U * 0.22, U * 0.27);
    g.moveTo(U * 0.22, -U * 0.27);  g.lineTo(U * 0.22, U * 0.27);
    g.stroke();
    g.strokeStyle = "#f4a9c8";
    g.lineWidth = U * 0.13;
    g.beginPath(); g.moveTo(-U * 0.22, 0); g.lineTo(U * 0.22, 0); g.stroke();
  }
  g.restore();
}

function drawBeacon(g, cs, t){
  const from = S.pathIdx.get(S.cc + "," + S.cr);
  if (from == null) return;                    // you've strayed off the route
  g.save();
  g.lineCap = "round";
  g.lineJoin = "round";
  g.strokeStyle = "rgba(240,192,74," + (0.45 + Math.sin(t * 4) * 0.16).toFixed(3) + ")";
  g.lineWidth = cs * 0.13;
  g.setLineDash([cs * 0.22, cs * 0.26]);
  g.lineDashOffset = -t * cs * 0.9;
  g.shadowColor = "rgba(240,192,74,0.55)";
  g.shadowBlur = cs * 0.4;
  g.beginPath();
  for (let i = from; i < S.path.length; i++){
    const [c, r] = S.path[i].split(",").map(Number);
    const px = cellX(c), py = cellY(r);
    if (i === from) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.stroke();
  g.restore();
}

function drawToasts(g, cs){
  for (const o of S.toasts){
    const a = Math.min(1, o.t / 0.18) * Math.min(1, (1.9 - o.t) / 0.5);
    if (a <= 0) continue;
    g.save();
    g.globalAlpha = a;
    g.font = "600 " + Math.max(11, Math.round(cs * 0.34)) + "px 'Avenir Next', 'Segoe UI', sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    const y = o.y - cs * 0.7 - o.t * cs * 0.5;
    const w = g.measureText(o.text).width + cs * 0.42;
    const h = cs * 0.62;
    g.fillStyle = "rgba(255,255,255,0.94)";
    g.shadowColor = "rgba(70,100,170,0.22)";
    g.shadowBlur = 12;
    roundRect(g, o.x - w / 2, y - h / 2, w, h, h / 2);
    g.fill();
    g.shadowBlur = 0;
    g.fillStyle = o.color || "#0f8f80";
    g.fillText(o.text, o.x, y);
    g.restore();
  }
}

function drawDot(g, x, y, cs, t, stillFrac, anger, joy){
  const r = cs * 0.26;
  const A = Math.max(0, Math.min(1, anger));      // colour / face blend
  const P = Math.max(0, anger);                   // arm pop, may overshoot

  // stillness ring — a thread winding tighter around you
  if (stillFrac > 0.02){
    const a = -Math.PI / 2 + stillFrac * Math.PI * 2;
    g.save();
    g.lineCap = "round";
    g.strokeStyle = stillFrac > 0.65 ? "rgba(232,127,174,0.85)" : "rgba(240,192,74,0.75)";
    g.lineWidth = cs * 0.075;
    g.beginPath();
    g.arc(x, y, r * 1.62, -Math.PI / 2, a);
    g.stroke();
    g.restore();
  }

  const J = Math.max(0, Math.min(1, joy || 0));
  const lit  = mix(mix(C_LIT[0],  C_LIT[1],  A), C_JOY[0], J);
  const mid  = mix(mix(C_MID[0],  C_MID[1],  A), C_JOY[1], J);
  const deep = mix(mix(C_DEEP[0], C_DEEP[1], A), C_JOY[2], J);
  const face = mix(mix(C_FACE[0], C_FACE[1], A), C_JOY[3], J);

  g.save();
  // an indignant little tremble, and a puff of outrage
  g.translate(x + Math.sin(t * 34) * cs * 0.02 * A, y - cs * 0.02 * A);
  const wob = 1 + Math.sin(t * 4.2) * 0.03 + A * 0.11 + Math.sin(t * 15) * 0.035 * A
                + J * (0.10 + Math.abs(Math.sin(t * 6)) * 0.09);   // a delighted little hop
  const R = r * wob;

  // body
  g.save();
  g.shadowColor = rgba(deep, 0.45);
  g.shadowBlur = cs * 0.5;
  const grad = g.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.12, 0, 0, R);
  grad.addColorStop(0, rgb(lit));
  grad.addColorStop(0.4, rgb(mid));
  grad.addColorStop(1, rgb(deep));
  g.fillStyle = grad;
  g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  g.restore();

  // shine
  g.fillStyle = "rgba(255,255,255," + (0.7 - A * 0.25).toFixed(2) + ")";
  g.beginPath(); g.ellipse(-R * 0.32, -R * 0.36, R * 0.26, R * 0.18, -0.6, 0, Math.PI * 2); g.fill();

  // ---- arms: they pop out and fold, crossly ----
  if (P > 0.001){
    const arm = (sx, sy, ex, ey, hx, hy) => {
      const mx = sx + (ex - sx) * P, my = sy + (ey - sy) * P;
      const fx = sx + (hx - sx) * P, fy = sy + (hy - sy) * P;
      g.strokeStyle = rgb(deep);
      g.lineWidth = R * 0.24;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(sx * R, sy * R);
      g.quadraticCurveTo(mx * R, my * R, fx * R, fy * R);
      g.stroke();
      g.fillStyle = rgb(mid);
      g.beginPath(); g.arc(fx * R, fy * R, R * 0.17, 0, Math.PI * 2); g.fill();
    };
    // right arm first so the left one folds over the top of it
    arm( 0.94, -0.02,  1.22, 0.72, -0.40, 0.50);
    arm(-0.94, -0.02, -1.22, 0.72,  0.40, 0.58);
  }

  // ---- eyes ----
  const ey = -0.12 + A * 0.05;
  const eh = 0.185 - A * 0.055;
  if (J > 0.45){
    // squeezed-shut happy eyes
    g.strokeStyle = rgb(face);
    g.lineWidth = R * 0.11;
    g.lineCap = "round";
    for (const side of [-1, 1]){
      g.beginPath();
      g.arc(side * R * 0.33, R * 0.02, R * 0.20, Math.PI * 1.15, Math.PI * 1.85);
      g.stroke();
    }
  } else {
    g.fillStyle = rgb(face);
    for (const side of [-1, 1]){
      g.beginPath();
      g.ellipse(side * R * 0.33, R * ey, R * 0.145, R * eh, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = "rgba(255,255,255," + (0.9 - A * 0.55).toFixed(2) + ")";
    for (const side of [-1, 1]){
      g.beginPath();
      g.arc(side * R * 0.33 - R * 0.05, R * (ey - 0.06), R * 0.055, 0, Math.PI * 2);
      g.fill();
    }
  }

  // ---- brows: only when cross ----
  if (A > 0.01){
    g.strokeStyle = rgba(face, A);
    g.lineWidth = R * 0.13;
    g.lineCap = "round";
    for (const side of [-1, 1]){
      g.beginPath();
      g.moveTo(side * R * 0.58, -R * (0.46 + 0.06 * A));
      g.lineTo(side * R * 0.13, -R * 0.24);
      g.stroke();
    }
  }

  // ---- mouth: a smile that turns into a pout ----
  g.lineCap = "round";
  g.lineWidth = R * 0.11;
  if (A < 0.99){
    g.strokeStyle = rgba(face, 1 - A);
    g.lineWidth = R * (0.11 + J * 0.03);
    g.beginPath();
    g.arc(0, R * (0.02 + J * 0.06), R * (0.40 + J * 0.09),
          Math.PI * (0.22 - J * 0.07), Math.PI * (0.78 + J * 0.07));
    g.stroke();
  }
  if (A > 0.01){
    g.strokeStyle = rgba(face, A);
    g.beginPath();
    g.arc(0, R * 0.54, R * 0.27, Math.PI * 1.22, Math.PI * 1.78);
    g.stroke();
  }

  // ---- the little anger mark ----
  if (A > 0.02){
    const s = R * 0.34 * (0.7 + Math.sin(t * 12) * 0.12);
    const ax = R * 0.92, ay = -R * 0.92;
    g.strokeStyle = "rgba(226,48,80," + A.toFixed(2) + ")";
    g.lineWidth = R * 0.10;
    g.beginPath();
    g.moveTo(ax - s * 0.55, ay - s * 0.10); g.lineTo(ax - s * 0.05, ay - s * 0.60);
    g.moveTo(ax - s * 0.05, ay - s * 0.60); g.lineTo(ax - s * 0.05, ay - s * 0.05);
    g.moveTo(ax + s * 0.05, ay + s * 0.05); g.lineTo(ax + s * 0.05, ay + s * 0.60);
    g.moveTo(ax + s * 0.05, ay + s * 0.60); g.lineTo(ax + s * 0.55, ay + s * 0.10);
    g.stroke();
  }

  g.restore();
}

function draw(){
  const w = stage.clientWidth, h = stage.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (!S.maze) return;

  ctx.save();
  if (S.shake > 0){
    const k = S.shake * 6;
    ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
  }

  const cs = S.cs;

  // the cloth the maze sits on
  ctx.save();
  ctx.shadowColor = "rgba(180,130,190,0.16)";
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#fffdfe";
  roundRect(ctx, S.ox - cs * 0.35, S.oy - cs * 0.35,
            cs * S.maze.cols + cs * 0.7, cs * S.maze.rows + cs * 0.7, cs * 0.35);
  ctx.fill();
  ctx.restore();

  // start nook
  ctx.fillStyle = "rgba(244,169,200,0.16)";
  ctx.beginPath(); ctx.arc(cellX(0), cellY(0), cs * 0.32, 0, Math.PI * 2); ctx.fill();

  // dead ends already charged — a small frayed mark
  ctx.save();
  ctx.strokeStyle = "rgba(232,127,174,0.5)";
  ctx.lineWidth = Math.max(1.2, cs * 0.055);
  ctx.lineCap = "round";
  S.deadSeen.forEach(k => {
    const [c, r] = k.split(",").map(Number);
    const x = cellX(c), y = cellY(r), s = cs * 0.15;
    ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
    ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
  });
  ctx.restore();

  // the trail you've left behind
  if (S.trail.length > 1){
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(185,140,240,0.30)";
    ctx.lineWidth = cs * 0.10;
    ctx.beginPath();
    ctx.moveTo(S.trail[0].x, S.trail[0].y);
    for (let i = 1; i < S.trail.length; i++) ctx.lineTo(S.trail[i].x, S.trail[i].y);
    ctx.lineTo(S.px, S.py);
    ctx.stroke();
    ctx.restore();
  }

  // the goal, under the threads
  drawGoal(ctx, cellX(S.maze.cols - 1), cellY(S.maze.rows - 1), cs, S.t);

  // the way ahead, while the glimmer lasts
  if (S.fx.beacon > 0) drawBeacon(ctx, cs, S.t);

  // charms waiting in the corridors
  S.charms.forEach((type, k) => {
    const [c, r] = k.split(",").map(Number);
    drawCharm(ctx, cellX(c), cellY(r), cs, type, S.t);
  });

  // the yarn itself
  if (S.fabric){
    ctx.drawImage(S.fabric, S.ox - S.fabricB, S.oy - S.fabricB, S.fabricW, S.fabricH);
  }

  if (S.rot) ctx.drawImage(S.rot, S.ox - S.fabricB, S.oy - S.fabricB, S.fabricW, S.fabricH);
  if (S.beast) drawBeast(ctx, cs, S.t);

  drawDot(ctx, S.px, S.py, cs, S.t, Math.min(1, S.still / S.stillMax), angerNow(), S.joy);
  drawToasts(ctx, cs);

  // dead-end flash
  if (S.flash > 0){
    ctx.fillStyle = "rgba(232,80,110," + (S.flash * 0.16).toFixed(3) + ")";
    ctx.fillRect(0, 0, w, h);
  }

  ctx.restore();

  drawConfetti(ctx);
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ============================================================
   Loop
   ============================================================ */
// 0 while content; springs past 1 as the arms fly out, then settles and fades
function angerNow(){
  if (S.angryT <= 0) return 0;
  const el = ANGRY_DUR - S.angryT;
  const p = Math.min(1, el / 0.18);
  const q = p - 1;
  const pop = 1 + 2.4 * q * q * q + 1.4 * q * q;   // ease-out-back
  return Math.min(pop, Math.min(1, S.angryT / 0.45));
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  S.t += dt;
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.6);
  if (S.angryT > 0) S.angryT = Math.max(0, S.angryT - dt);
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 3.2);

  if (S.mode === "play"){
    if (S.moving){
      S.mt += dt / moveTime();
      if (S.mt >= 1){ arrive(); }
      else {
        const e = S.mt < 0.5 ? 2 * S.mt * S.mt : 1 - Math.pow(-2 * S.mt + 2, 2) / 2;
        S.px = cellX(S.cc) + (cellX(S.tc) - cellX(S.cc)) * e;
        S.py = cellY(S.cr) + (cellY(S.tr) - cellY(S.cr)) * e;
      }
    } else {
      for (let d = 0; d < 4; d++) if (held[d]){ tryMove(d); break; }
    }

    if (!S.moving){
      // scissors slow the winding; a spare spool stops it dead
      const rate = S.fx.freeze > 0 ? 0 : (S.fx.slow > 0 ? 0.74 : 1);
      S.still += dt * rate;
      if (S.still >= S.stillMax){
        gameOver("You sat too long.",
          "The yarn wound itself around you while you were thinking. Keep drifting next time — even a wrong turn beats standing still.");
      }
    }

    const frac = Math.min(1, S.still / S.stillMax);
    stillfill.style.width = (frac * 100).toFixed(1) + "%";
    stillbar.classList.toggle("warn", frac > 0.65);

    // charm timers
    let fxChanged = false;
    for (const k in S.fx){
      if (S.fx[k] > 0){ S.fx[k] = Math.max(0, S.fx[k] - dt); fxChanged = true; }
    }
    if (fxChanged) paintFx();

    // the beast
    if (!S.beast){
      S.beastT -= dt;
      if (S.beastT <= LEVELS[S.level].beast * 0.45 && !S.beastWarned){
        S.beastWarned = true;
        S.toasts.push({x: S.px, y: S.py, text: "The yarn is trembling\u2026", color: "#e0607f", t: 0});
      }
      if (S.beastT <= 0) wakeBeast();
    } else {
      stepBeast(dt);
    }

    // the clock
    S.levelT += dt;
    const stamp = fmtTime(S.levelT);
    if (stamp !== S.stamp){ S.stamp = stamp; timechip.textContent = stamp; }
  }

  if (S.mode === "cheer"){
    S.cheerT += dt;
    if (S.cheerT >= CHEER_DUR) showClearCard();
  }

  // green with delight once the gold is found
  const wantJoy = (S.mode === "cheer" || S.mode === "clear" || S.mode === "win") ? 1 : 0;
  S.joy += (wantJoy - S.joy) * Math.min(1, dt * 7);

  stepConfetti(dt);
  for (let i = S.toasts.length - 1; i >= 0; i--){
    S.toasts[i].t += dt;
    if (S.toasts[i].t > 1.9) S.toasts.splice(i, 1);
  }

  draw();
  requestAnimationFrame(frame);
}

/* ============================================================
   Input
   ============================================================ */
const KEYMAP = {
  ArrowUp: 0, KeyW: 0,
  ArrowRight: 1, KeyD: 1,
  ArrowDown: 2, KeyS: 2,
  ArrowLeft: 3, KeyA: 3
};

window.addEventListener("keydown", e => {
  if (S.mode !== "play"){
    if ((e.code === "Enter" || e.code === "Space") && S.primary){ e.preventDefault(); S.primary(); }
    return;
  }
  const d = KEYMAP[e.code];
  if (d === undefined) return;
  e.preventDefault();
  held[d] = true;
  tryMove(d);
});
window.addEventListener("keyup", e => {
  const d = KEYMAP[e.code];
  if (d !== undefined) held[d] = false;
});
window.addEventListener("blur", () => { for (const k in held) held[k] = false; });

// swipe
let tsx = 0, tsy = 0, tActive = false;
stage.addEventListener("touchstart", e => {
  const t = e.changedTouches[0]; tsx = t.clientX; tsy = t.clientY; tActive = true;
}, {passive: true});
stage.addEventListener("touchmove", e => {
  if (!tActive || S.mode !== "play") return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tsx, dy = t.clientY - tsy;
  const dist = Math.hypot(dx, dy);
  if (dist < 26) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  tryMove(d);
  tsx = t.clientX; tsy = t.clientY;
}, {passive: true});
stage.addEventListener("touchend", () => { tActive = false; }, {passive: true});

window.addEventListener("resize", () => { layout(); });

/* ============================================================
   Go
   ============================================================ */
S.maze = genMaze(LEVELS[0].c, LEVELS[0].r, mulberry32(20260901));
{ const sol = solve(S.maze); S.path = sol.path; S.pathIdx = sol.idx; }
S.charms = new Map();
S.threads = MAX_THREADS;
paintHud();
layout();
S.px = cellX(0); S.py = cellY(0);
title();
requestAnimationFrame(frame);

})();
</script>
